[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpkins"
version = "0.1.0"
description = "Experimental pipeline: catch risky C++ patterns from git diffs without building the target project (clang-tidy + LLM post-processing)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "unidiff>=0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Structural (AST) checks for `learn --infer`. Native/ABI-fragile, so
    # languages/cpp_ast.py import-guards it — a broken install degrades that one
    # check instead of crashing unrelated commands (see the module docstring).
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pumpkins = "pumpkins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
