[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpkins"
version = "0.1.0"
description = "Experimental pipeline: catch risky C++ patterns from git diffs without building the target project (clang-tidy + LLM post-processing)."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "unidiff>=0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Structural (AST) checks. Native and ABI-fragile: the two packages must
    # agree on the C ABI, and the Python API changed across 0.21→0.22→0.23.
    # Upper bounds are what actually prevents the common failure — an
    # unconstrained upgrade of one half skewing against the other. They cannot
    # prevent "no wheel for this platform and no compiler"; that needs build
    # tools. So the import is still guarded (languages/cpp/ast.py) and the
    # fallback now announces itself instead of silently changing results.
    "tree-sitter>=0.23,<0.27",
    "tree-sitter-cpp>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pumpkins = "pumpkins.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
